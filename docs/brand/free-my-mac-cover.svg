<svg width="1440" height="520" viewBox="0 0 1440 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Free My Mac Desktop</title>
  <desc id="desc">Brand cover for a native macOS cleanup assistant.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#172033"/>
      <stop offset="1" stop-color="#13251F"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#19B7FF"/>
      <stop offset="1" stop-color="#27D5C7"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#28D17C"/>
      <stop offset="1" stop-color="#B7F36B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1440" height="520" rx="36" fill="url(#surface)"/>
  <circle cx="1180" cy="88" r="190" fill="#27D5C7" opacity="0.09"/>
  <circle cx="190" cy="430" r="230" fill="#FFB547" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="78" y="66" width="396" height="388" rx="28" fill="#0F172A" stroke="#263449"/>
    <rect x="108" y="102" width="118" height="34" rx="17" fill="#6D5DFB"/>
    <rect x="108" y="168" width="304" height="42" rx="12" fill="#1F2A44"/>
    <rect x="108" y="230" width="240" height="20" rx="10" fill="#41516B"/>
    <rect x="108" y="274" width="270" height="20" rx="10" fill="#334155"/>
    <rect x="108" y="318" width="214" height="20" rx="10" fill="#334155"/>
    <rect x="108" y="362" width="250" height="20" rx="10" fill="#334155"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="532" y="92" width="820" height="336" rx="32" fill="#0B1220" stroke="#263449"/>
    <rect x="588" y="148" width="184" height="96" rx="18" fill="#151E30"/>
    <rect x="806" y="148" width="184" height="96" rx="18" fill="#151E30"/>
    <rect x="1024" y="148" width="184" height="96" rx="18" fill="#151E30"/>
    <rect x="588" y="282" width="290" height="92" rx="18" fill="#111D2A" stroke="#1F8AFF" stroke-opacity="0.55"/>
    <rect x="918" y="282" width="290" height="92" rx="18" fill="#111D2A" stroke="#FF9F43" stroke-opacity="0.55"/>

    <rect x="618" y="308" width="44" height="44" rx="12" fill="url(#aqua)"/>
    <rect x="948" y="308" width="44" height="44" rx="12" fill="url(#amber)"/>
    <rect x="618" y="176" width="34" height="34" rx="10" fill="url(#mint)"/>
    <rect x="836" y="176" width="34" height="34" rx="10" fill="url(#aqua)"/>
    <rect x="1054" y="176" width="34" height="34" rx="10" fill="url(#amber)"/>
  </g>

  <text x="548" y="64" fill="#E5EEF7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Free My Mac Desktop</text>
  <text x="532" y="478" fill="#95A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Clean Your Mac with review-first cleanup, quarantine, restore, and permanent purge control.</text>

  <text x="588" y="190" fill="#E5EEF7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Scan</text>
  <text x="588" y="218" fill="#95A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Nothing moves yet</text>
  <text x="806" y="190" fill="#E5EEF7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Review</text>
  <text x="806" y="218" fill="#95A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Risk and reason</text>
  <text x="1024" y="190" fill="#E5EEF7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Quarantine</text>
  <text x="1024" y="218" fill="#95A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Restore before purge</text>
</svg>
