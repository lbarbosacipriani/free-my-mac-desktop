services:
  free-my-mac:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREE_MY_MAC_HOME: /host-home
      FREE_MY_MAC_QUARANTINE: /data/quarantine
      FREE_MY_MAC_REPORTS: /data/reports
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - "${HOME}:/host-home:rw"
      - "./quarantine:/data/quarantine:rw"
      - "./reports:/data/reports:rw"
